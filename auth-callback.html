<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JPS Astro — Signing in</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
    .box{padding:28px 32px;border-radius:16px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center;max-width:360px}
    .spin{width:28px;height:28px;margin:0 auto 16px;border:4px solid #ddd;border-top-color:#4285f4;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error{display:none;color:#b00020;white-space:pre-wrap;word-break:break-word}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <h2 id="title">Completing Google sign-in…</h2>
    <p id="text">Please wait.</p>
    <div id="error"></div>
  </div>
<script>
(function(){
  const SUPABASE_URL='https://grbyzrmrvwzytxkyiqcg.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_RjTUH6Y5LUUSThYYz05kLA_7tcuh7mh';
  const HOME='https://jayprakash3195.github.io/pass/';
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}
  });

  function goHome(){
    try{window.history.replaceState({},document.title,HOME);}catch(e){}
    window.location.replace(HOME);
  }

  function fail(e){
    document.getElementById('spin').style.display='none';
    document.getElementById('title').textContent='Google sign-in could not be completed';
    document.getElementById('text').style.display='none';
    const el=document.getElementById('error');
    el.style.display='block';
    el.textContent=(e&&e.message)?e.message:'Please try again.';
  }

  let finished=false;
  async function check(){
    if(finished) return;
    try{
      const {data,error}=await sb.auth.getSession();
      if(error) throw error;
      if(data && data.session && data.session.user){
        finished=true;
        goHome();
        return;
      }
      if(!window.location.hash.includes('access_token=')){
        // If the callback is opened directly and an existing session is not present,
        // return to the normal login page.
        finished=true;
        goHome();
      }
    }catch(e){fail(e);}
  }

  sb.auth.onAuthStateChange(function(event,session){
    if((event==='SIGNED_IN'||event==='INITIAL_SESSION') && session && session.user){
      finished=true;
      goHome();
    }
  });

  check();
  setTimeout(check,300);
  setTimeout(check,800);
  setTimeout(function(){
    if(!finished && window.location.hash.includes('access_token=')){
      fail(new Error('Google authentication returned, but Supabase did not create a session. Check the Supabase redirect URL and Google provider settings.'));
    }
  },2500);
})();
</script>
</body>
</html>
